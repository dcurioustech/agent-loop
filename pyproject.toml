[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-loop"
version = "0.1.0"
description = "Checkpoint-gated developer/reviewer loop across Claude Code, Codex, Grok, Gemini, and Antigravity CLIs."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Dwaraka Ramana Turlapati" }]
license = { text = "MIT" }

[project.scripts]
agent-loop = "agent_loop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
