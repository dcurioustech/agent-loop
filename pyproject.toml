[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-loop-tool"
version = "0.1.0"
description = "Checkpoint-gated developer/reviewer loop across Claude Code, Codex, Grok, and Antigravity CLIs."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Dwaraka Ramana Turlapati" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ai", "agents", "claude", "codex", "code-review", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/dcurioustech/agent-loop"
Issues = "https://github.com/dcurioustech/agent-loop/issues"

[project.scripts]
agent-loop = "agent_loop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
